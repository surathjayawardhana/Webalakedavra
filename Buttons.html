<!DOCTYPE html>
<html>
    <head>
        <title>Buttons</title>
        <style>
            .request_now_button{
                background-color: black;
                color: white;
                padding-bottom: 10px;
                padding-top: 10px;
                padding-left: 16px;
                padding-right: 16px;
                margin-right: 8px;
                cursor: pointer;
                border: none;
                transition: box-shadow,backgound-color,color 0.15s;
            }
            .request_now_button:hover{
                box-shadow: 0px 5px 10px rgba(0,0,0,0.15);
            }
            .request_now_button:active{
                background-color: white;
                color: black;
            }

            .add_button{
                background-color: rgb(255, 216, 20);
                border: none;
                padding-bottom: 10px;
                padding-top: 10px;
                padding-left: 45px;
                padding-right: 45px;
                border-radius: 20px;
                cursor:pointer;
                margin-right: 8px;
                transition: background-color,color 0.15s;
            }
            .add_button:hover{
                background-color: rgb(255, 200, 10);
            }
            .add_button:active{
                background-color: black;
                color: rgb(255, 200, 10);
            }
            
            .signup_button{
                background-color: rgb(46, 164, 79);
                color: white;
                border:none;
                padding-bottom: 10px;
                padding-top: 10px;
                padding-left: 16px;
                padding-right: 16px;
                border-radius: 6px;
                font-weight: bold;
                cursor: pointer;
                transition: opacity 0.15s;
            }

            .signup_button:hover{
                box-shadow: 0px 5px 10px rgba(0,0,0,0.15);
            }

            .signup_button:active{
                opacity: 0.8;
            }

            .Get_started{
                background-color: rgb(121, 82, 125);
                border: none;
                margin-top: 8px;
                margin-right: 8px;
                color: white;
                border-radius: 6px;
                padding-bottom: 11px;
                padding-top: 11px;
                padding-left: 26px;
                padding-right: 26px;
                font-weight: bold;
                cursor: pointer;
                transition: background-color,opacity 0.15s;
            }

            .Get_started:hover{
                background-color: blueviolet;
            }
            .Get_started:active{
                opacity: 0.8;
            }
            .download_button{
                background-color: white;
                border-color: rgb(108, 117, 125);
                color: rgb(108, 117, 125);
                border-width: 1px;
                border-style: solid;
                border-radius: 6px;
                padding-bottom: 10px;
                padding-top: 10px;
                padding-left: 35px;
                padding-right: 35px;
                cursor: pointer;
                margin-top: 8px;
                margin-right: 8px;
                transition: background-color,color,opacity 0.15s;
            }

            .download_button:hover{
                background-color: rgb(108, 117, 125);
                color: white;
            }

            .download_button:active{
                opacity: 0.8;
            }

            .apply_button{
                background-color: rgb(10,102,194);
                border: none;
                padding-bottom: 11px;
                padding-top: 11px;
                padding-left: 26px;
                padding-right: 26px;
                border-radius: 18px;
                color: white;
                font-weight: bold;
                cursor: pointer;
                margin-right: 8px;
                transition: background-color,opacity 0.15s;
            }

            .apply_button:hover{
                background-color: blue;
            }

            .apply_button:active{
                opacity: 0.6;
            }

            .save_button{
                background-color: white;
                color: rgb(10,102,194);
                border-color: rgb(10,102,194);
                border-style: solid;
                border-width: 1px;
                padding-bottom: 10px;
                padding-top: 10px;
                padding-left: 20px;
                padding-right: 20px;
                border-radius: 18px;
                cursor: pointer;
                transition: background-color,color,border-color 0.15s;
            }

            .save_button:hover{
                background-color: rgb(237, 246, 255);
            }

            .save_button:active{
                color:black;
                border-color: black;
            }

            .bn_button{
                background-color: aliceblue;
                padding-top: 10px;
                padding-bottom: 10px;
                padding-right: 16px;
                padding-left: 16px;
                border-radius: 16px;
                vertical-align: baseline;
                border-style: solid;
                cursor: pointer;
                transition: opacity,background-color 0.15s;
            }

            .bn_button:hover{
                opacity: 0.8;
            }

            .bn_button:active{
                background-color: rgb(192, 192, 247);
            }

            .shadow_button{
                background-color: green;
                border: none;
                padding-top: 5px;
                padding-bottom: 5px;
                padding-right: 16px;
                padding-left: 16px;
                cursor: pointer;
                color: white;
                font-size: 15;
                transition: all 0.015s;
            }

            .shadow_button:hover{
                box-shadow: 5px 5px 10px rgba(0,0,0,0.15);
            }

            .shadow_button:active{
                margin-top: 5px;
                margin-left: 5px;
            }

            .s_button{
                background-color: green;
                border: none;
                padding-top: 5px;
                padding-bottom: 5px;
                padding-right: 16px;
                padding-left: 16px;
                cursor: pointer;
                color: white;
                font-size: 15;
                transition: all 0.30s;
            }

            .s_button:hover{
                padding-top: 10px;
                padding-bottom: 10px;
                padding-right: 32px;
                padding-left: 32px;
            }

            .ont_button{
                background-color: green;
                border: none;
                padding-top: 5px;
                padding-bottom: 5px;
                padding-right: 16px;
                padding-left: 16px;
                cursor: pointer;
                color: white;
                font-size: 15;
                margin-right: 16px;
                transition: all 0.30s;
            }

            .ont_button:hover{
                padding-left: 26px;
                padding-right: 26px;
            }
        </style>
    </head>

    <body>  
    
        <button class="Request_now_button">
            Request now
        </button>

        <button class="Add_button">
            Add to Cart
        </button>

        <button class="Signup_button">
            Sign up
        </button>

        <br>
        <button class="Get_started">
            Get started
        </button>

        <button class="download_button">
            Download
        </button>

        <button class="apply_button">
            Apply on company website
        </button>

        <button class="save_button">
            Save
        </button>
        <br><br>


         <button class="bn_button">
            Back
        </button> &nbsp;


        <a href="https://www.geeksforgeeks.org/" target="_blank"> 1</a>&nbsp;
        <a href="https://www.geeksforgeeks.org/" target="_blank"> 2</a>&nbsp;
        <a href="https://www.geeksforgeeks.org/" target="_blank"> 3</a>&nbsp;
        <a href="https://www.geeksforgeeks.org/" target="_blank"> 4</a>&nbsp;
        <a href="https://www.geeksforgeeks.org/" target="_blank"> 5</a>&nbsp;

        &nbsp;
        <button class="bn_button">
            Next
        </button>
        <br><br>

        <button class="Shadow_button">
            Shadow
        </button>

        <br><br>

        <button class="s_button">
            Stretch
        </button>

        <br><br>

        <button class="ont_button">
            One
        </button>

        <button class="ont_button">
            Two
        </button>

        <button class="ont_button">
            Three
        </button>



    </body>

        
</html>
