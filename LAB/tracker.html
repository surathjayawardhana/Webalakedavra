<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Calorie Tracker</title>
    <link rel="stylesheet" href="tracker.css">
</head>
<body>
    <h1>Workout Calorie Tracker</h1>
    <form>
    <select>
        <option value="">Exercise</option>
        <option>Running</option>
        <option>Cycling</option>
        <option>Swimming</option>
        <option>Yoga</option>
    </select>
    <label>
        Minutes
    </label>
    <input name="minput" type="number" id="min"><br>
    <button type="button" id="bb2">Add Workout</button>
</form>

<table>
    <tr>
        <th>#</th>
        <th>Exercise</th>
        <th>Minutes</th>
        <th>Calories</th>
    </tr>
</table>

<small>Total calories burned: 0 kcal</small>
</body>
</html>
