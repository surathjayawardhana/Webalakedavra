<!DOCTYPE html>
<html>

<head>
    <title>Movie Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Movie Night Ticket Booking</h1>
    <hr>
    <div id="sssd">
        <form>


        <label>Customer's Name : </label>
        <input type="text" placeholder="Jon Doe"><br>
        <label>E-mail Address : </label>
        <input type="email" placeholder="harry.p@hmail.com"><br>
        <label>Movie : </label>
        <select>
            <option>The Lost City</option>
            <option>Midnight Mystery</option>
            <option>Future World</option>
        </select><br>
        <label>Show Date : </label>
        <input type="date"><br>
        <label>No:of Tickets : </label>
        <input type="number" placeholder="ex: 5"><br>
        <label>Snacks : </label><br>
        <input type="checkbox"> :   Popcone  <br>
        <input type="checkbox"> :   Soft Drink <br>
        <input type="checkbox"> :   Nachos<br>
        <label>Spaceal Requests : </label><br>
        <textarea rows="5" placeholder="Type hear"></textarea><br>
        <button type="submit">Add Tickets</button>
        <button type="reset">Clear</button>
        

    </form>
    </div>
</body>
</html>
