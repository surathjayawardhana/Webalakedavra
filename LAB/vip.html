            window.alert("You Got The Discout")
            document.write("You got the Discount")
        } else{
            window.alert("You Did not Got The Discout")
            document.write("You Did not got the Discount")
        }


    </script>
    <script>

        let tcount = 30;

        let TItem = tcount + jcount;

        window.alert("Total Revenue = " + Tcost +"\nTotal Items = " + TItem);

        } else{

        }
